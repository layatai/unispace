[package]
name = "unispace-linux"
version = "1.1.4"
edition = "2024"
license = "MIT"
description = "UniSpace receiver for Linux"

[lib]
name = "unispace_linux"
path = "src/lib.rs"

[[bin]]
name = "unispace-linux"
path = "src/main.rs"

[[bin]]
name = "unispace-linux-ui"
path = "src/bin/ui.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
anyhow = "1.0"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
base64 = "0.22"
chacha20poly1305 = { version = "0.10", features = ["std"] }
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
evdev = "0.13"
futures = "0.3"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
keyring = { version = "3.6", features = ["sync-secret-service"] }
libc = "0.2"
ksni = "0.3.6"
notify-rust = "4.11"
p256 = { version = "0.13", features = ["ecdh", "pem"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
tempfile = "3.21"

[profile.release]
lto = "thin"
strip = true
