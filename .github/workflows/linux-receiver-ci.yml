name: Linux receiver

on:
  pull_request:
    paths:
      - "Linux/**"
      - "Sources/Domain/**"
      - "Sources/Application/ConnectionPolicy.swift"
      - "Sources/Infrastructure/NetworkPeerTransport.swift"
      - ".github/workflows/linux-receiver-ci.yml"
  push:
    branches: [master]
    paths:
      - "Linux/**"
      - "Sources/Domain/**"
      - "Sources/Application/ConnectionPolicy.swift"
      - "Sources/Infrastructure/NetworkPeerTransport.swift"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path Linux/Cargo.toml -- --check
      - name: Test
        run: cargo test --locked --manifest-path Linux/Cargo.toml
      - name: Lint
        run: cargo clippy --locked --manifest-path Linux/Cargo.toml --all-targets -- -D warnings
