name: Apply Swift 6 capture compatibility fix

on:
  push:
    branches:
      - agent/finder-file-copy-paste-continuity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finder-file-copy-paste-continuity
          fetch-depth: 0

      - name: Patch AppModel discovery callback
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("Sources/App/AppModel.swift")
          text = path.read_text()
          old = r'''                switch status {
                case .ready:
                    statusMessage = setupState == .hostingPairing
                        ? "Visible to nearby devices as \(localDevice.name)"
                        : "Searching the local network"
                case let .waiting(message):
                    statusMessage = "Waiting for local network access: \(message)"
                case let .failed(message):
                    lastError = "Local network discovery failed: \(message)"
                    setupState = workspace == nil ? .needsWorkspace : .ready
                }
'''
          new = r'''                switch status {
                case .ready:
                    self.statusMessage = self.setupState == .hostingPairing
                        ? "Visible to nearby devices as \(self.localDevice.name)"
                        : "Searching the local network"
                case let .waiting(message):
                    self.statusMessage = "Waiting for local network access: \(message)"
                case let .failed(message):
                    self.lastError = "Local network discovery failed: \(message)"
                    self.setupState = self.workspace == nil ? .needsWorkspace : .ready
                }
'''
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit("Expected AppModel callback block was not found")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/App/AppModel.swift
          if git diff --cached --quiet; then
            echo "AppModel is already patched"
            exit 0
          fi
          git commit -m "fix: make discovery callback captures explicit"
          git push origin "HEAD:${GITHUB_REF_NAME}"
