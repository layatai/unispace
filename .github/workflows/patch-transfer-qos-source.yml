name: Patch Transfer QoS Source

on:
  push:
    branches:
      - perf/continuity-transfer-qos

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply test and security-scope fixes
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "Tests/InfrastructureTests/TransferQoSInfrastructureTests.swift",
              """        XCTAssertTrue(await eventually {\n            underlying.chunkCount() == 1\n        })\n""",
              """        let firstChunkSent = await eventually {\n            underlying.chunkCount() == 1\n        }\n        XCTAssertTrue(firstChunkSent)\n""",
          )

          replace_once(
              "Sources/Infrastructure/StreamingPersistentFileSourceProvider.swift",
              """                    let live = LiveEntry(\n                        url: url,\n                        byteCount: storedEntry.byteCount,\n                        modificationDate: storedEntry.modificationDate,\n                        sha256: storedEntry.sha256\n                    )\n                    try validate(live, tolerantDateComparison: true)\n                    entries[storedEntry.entryID] = live\n""",
              """                    let live = LiveEntry(\n                        url: url,\n                        byteCount: storedEntry.byteCount,\n                        modificationDate: storedEntry.modificationDate,\n                        sha256: storedEntry.sha256\n                    )\n                    let access = url.startAccessingSecurityScopedResource()\n                    defer { if access { url.stopAccessingSecurityScopedResource() } }\n                    try validate(live, tolerantDateComparison: true)\n                    entries[storedEntry.entryID] = live\n""",
          )

          replace_once(
              "Sources/Infrastructure/StreamingPersistentFileSourceProvider.swift",
              """        if let session = sessions[key] { return session }\n        try validate(entry, tolerantDateComparison: false)\n        validationCount &+= 1\n        let access = entry.url.startAccessingSecurityScopedResource()\n        do {\n            let handle = try FileHandle(forReadingFrom: entry.url)\n""",
              """        if let session = sessions[key] { return session }\n        let access = entry.url.startAccessingSecurityScopedResource()\n        do {\n            try validate(entry, tolerantDateComparison: false)\n            validationCount &+= 1\n            let handle = try FileHandle(forReadingFrom: entry.url)\n""",
          )
          PY

      - name: Commit fixes and remove one-shot workflow
        run: |
          rm .github/workflows/patch-transfer-qos-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/Infrastructure/StreamingPersistentFileSourceProvider.swift Tests/InfrastructureTests/TransferQoSInfrastructureTests.swift .github/workflows/patch-transfer-qos-source.yml
          git commit -m "fix: compile QoS tests and preserve source sandbox access"
          git push origin HEAD:perf/continuity-transfer-qos
