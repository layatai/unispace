name: Linux apps build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Linux/**"
      - "Scripts/build-linux.sh"
      - ".github/workflows/linux-apps.yml"
  push:
    branches: [master]
    paths:
      - "Linux/**"
      - "Scripts/build-linux.sh"
      - ".github/workflows/linux-apps.yml"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            wget

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Linux
          key: ${{ matrix.arch }}

      - name: Install UI dependencies
        working-directory: Linux/ui
        run: pnpm install --frozen-lockfile

      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' \
            | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm
          nfpm --version

      - name: Build and package (deb + rpm)
        run: ./Scripts/build-linux.sh

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: unispace-linux-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

      - name: Upload raw binaries
        uses: actions/upload-artifact@v4
        with:
          name: unispace-linux-binaries-${{ matrix.arch }}
          path: |
            .build/linux/release/unispace-linux
            .build/linux/release/unispace-linux-ui
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: unispace-linux-a*
          merge-multiple: true
          path: dist

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
          fail_on_unmatched_files: true