name: Transfer QoS CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-unit-and-qos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify generated Xcode project is current
        run: |
          xcodegen generate
          git diff --exit-code -- UniSpace.xcodeproj/project.pbxproj

      - name: Run transfer QoS regression tests
        run: |
          xcodebuild test \
            -project UniSpace.xcodeproj \
            -scheme UniSpace \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:UniSpaceInfrastructureTests/TransferQoSInfrastructureTests \
            CODE_SIGNING_ALLOWED=NO

      - name: Run complete non-UI suite
        run: ./Scripts/test.sh --unit

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transfer-qos-xcresults
          path: .build/test-results/*.xcresult
          if-no-files-found: ignore
          retention-days: 14
